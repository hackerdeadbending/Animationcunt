name: Animation Studio checks
on:
  push:
    branches:
      - main
      - feature/iphone-animation-studio
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate editor and app shell
        run: node scripts/smoke-test.mjs
